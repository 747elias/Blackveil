name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Require a version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -notmatch '^refs/tags/v\d+\.\d+\.\d+$') { throw 'Release muss auf einem Versionstag laufen.' }
      - name: Build and test
        shell: pwsh
        run: |
          dotnet build Blackveil.sln -c Release -warnaserror
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test tests/Blackveil.Core.Tests -c Release --no-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/Blackveil.Windows.Tests -c Release --no-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Package portable EXE, ZIP, installer and checksums
        run: ./scripts/Package.ps1
      - name: Install, run and uninstall the packaged app
        run: ./scripts/Test-Installer.ps1
      - name: Exercise portable and installed updates
        run: ./scripts/Test-Update.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Blackveil-release
          path: artifacts/release/*
          if-no-files-found: error
      - name: Publish GitHub Release and verify all assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title "Blackveil $($tag.TrimStart('v'))" --notes-file artifacts/release-notes.md --draft
            if ($LASTEXITCODE) { throw 'Release konnte nicht erstellt werden.' }
          }
          gh release upload $tag artifacts/release/* --clobber
          if ($LASTEXITCODE) { throw 'Upload fehlgeschlagen.' }
          $release = gh release view $tag --json assets | ConvertFrom-Json
          $version = $tag.TrimStart('v')
          foreach ($name in @('Blackveil.exe', "Blackveil-Setup-$version.exe", "Blackveil-$version-win-x64.zip", 'SHA256SUMS.txt')) {
            if ($name -notin $release.assets.name) { throw "Asset fehlt: $name" }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE) { throw 'Veröffentlichung fehlgeschlagen.' }
