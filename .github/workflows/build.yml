name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build without warnings
        run: dotnet build Blackveil.sln -c Release -warnaserror
      - name: Unit tests
        run: dotnet test tests/Blackveil.Core.Tests -c Release --no-build --logger trx
      - name: Native Windows integration tests
        run: dotnet run --project tests/Blackveil.Windows.Tests -c Release --no-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-screenshots
          path: artifacts/screenshots/*.png
