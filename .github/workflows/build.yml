name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build without warnings
        run: dotnet build Blackveil.sln -c Release -warnaserror
      - name: Unit tests
        run: dotnet test tests/Blackveil.Core.Tests -c Release --no-build --logger trx
      - name: Native Windows integration tests
        run: dotnet run --project tests/Blackveil.Windows.Tests -c Release --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
